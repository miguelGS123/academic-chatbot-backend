version: "3.9"

services:
  auth-service:
    build:
      context: ./backend/services/auth-service
    container_name: auth-service
    ports:
      - "8001:8000"
    env_file:
      - ./backend/services/auth-service/.env
    volumes:
      - ./backend/services/auth-service:/app
    restart: always

  study-service:
    build:
      context: ./backend/services/study-service
    container_name: study-service
    ports:
      - "8002:8002"
    env_file:
      - ./backend/services/study-service/.env
    volumes:
      - ./backend/services/study-service:/app
    restart: always