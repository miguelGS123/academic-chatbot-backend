name: Mobile Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/mobile-app/**"

  push:
    branches:
      - main
    paths:
      - "frontend/mobile-app/**"

jobs:
  mobile-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint