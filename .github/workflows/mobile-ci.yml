name: Academic Platform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/mobile-app/**"
      - "backend/services/auth-service/**"
      - "backend/services/study-service/**"
      - "backend/services/questions-service/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "frontend/mobile-app/**"
      - "backend/services/auth-service/**"
      - "backend/services/study-service/**"
      - "backend/services/questions-service/**"
      - ".github/workflows/**"

jobs:
  mobile-quality:
    name: Mobile Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

  auth-service-quality:
    name: Auth Service Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/services/auth-service

    env:
      APP_NAME: Academic Chatbot API
      APP_VERSION: 1.0.0
      ENVIRONMENT: test
      API_V1_PREFIX: /api/v1
      SECRET_KEY: test_secret_key_for_ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/services/auth-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python imports
        run: python -m compileall app

      - name: Validate FastAPI app import
        run: python -c "from app.main import app; print(app.title)"